name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate PWA & JS
        run: |
          node -e "new Function(require('fs').readFileSync('app.js','utf8')); console.log('app.js OK')"
          node -e "new Function(require('fs').readFileSync('words.js','utf8').replace('window.WORD_BANK','const WB')); console.log('words.js OK')"
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest')); if(!m.icons||m.icons.length<2) throw Error('Invalid manifest'); console.log('manifest OK')"

      - name: Prepare static artifact
        run: |
          rm -rf dist
          mkdir -p dist/js dist/sounds
          cp index.html app.js words.js styles.css manifest.webmanifest sw.js dist/ 2>/dev/null || true
          cp auth.js dist/ 2>/dev/null || true
          cp favicon-32.png apple-touch-icon.png icon-*.png dist/ 2>/dev/null || true
          cp js/*.js dist/js/ 2>/dev/null || true
          cp sounds/* dist/sounds/ 2>/dev/null || true
          ls -lh dist/
          echo "Artifact ready"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
