# Give Gradle enough memory for Flutter's universal debug APK.
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
# All dependencies are AndroidX-native. Disabling Jetifier avoids needlessly
# transforming Flutter engine JARs (the previous v2.0.1 build ran out of heap
# during JetifyTransform on x86_64_debug).
android.enableJetifier=false
